name: Real local Lighthouse and Gemma evidence
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/real-ai-evidence.yml'
      - 'scripts/real-ai-evidence.mjs'
permissions:
  contents: read
jobs:
  local-lighthouse-and-gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app
        run: npm install --no-audit --no-fund
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull Gemma 3 1B
        run: |
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull gemma3:1b
      - name: Run real Lighthouse in headless Chrome (no PageSpeed quota)
        run: |
          mkdir -p evidence
          google-chrome --version
          npx --yes lighthouse@12 "https://ncodest.com/" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=evidence/lighthouse-report.json --quiet \
          || {
            echo "N-CODE website audit inaccessible in runner; using public example.com fallback and documenting that URL.";
            npx --yes lighthouse@12 "https://example.com/" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path=evidence/lighthouse-report.json --quiet;
          }
      - name: Generate recommendations with real open-weight Gemma 3
        run: node --experimental-strip-types scripts/real-ai-evidence.mjs
      - name: Save genuine evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-lighthouse-gemma-evidence
          path: evidence/
          if-no-files-found: warn
